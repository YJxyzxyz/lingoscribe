name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Resolve native engine package for reproducible formatting
        run: |
          cd ../../packages/offline_engine
          flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test ../../packages/offline_engine/lib
      - run: flutter analyze
      - name: Analyze native engine Dart bindings
        run: |
          cd ../../packages/offline_engine
          flutter analyze
      - run: flutter test --coverage --concurrency=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage
          path: apps/mobile/coverage/lcov.info
  android:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Compile Android debug and unsigned distribution bundle
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build apk --debug --target-platform android-arm64,android-x64
          flutter build appbundle --release --target-platform android-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-debug-and-unsigned-aab
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
            apps/mobile/build/app/outputs/bundle/release/*.aab
  ios:
    needs: quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build native Whisper XCFramework from pinned source
        run: bash tools/build_ios_engine.sh
      - name: Compile iOS without private signing credentials
        working-directory: apps/mobile
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-unsigned-app
          path: apps/mobile/build/ios/iphoneos/Runner.app
