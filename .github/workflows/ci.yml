name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Resolve native engine package for reproducible formatting
        run: |
          cd ../../packages/offline_engine
          flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test ../../packages/offline_engine/lib
      - run: flutter analyze
      - name: Analyze native engine Dart bindings
        run: |
          cd ../../packages/offline_engine
          flutter analyze
      - run: flutter test --coverage --concurrency=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage
          path: apps/mobile/coverage/lcov.info
  android:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Compile Android debug and unsigned distribution bundle
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --debug --target-platform android-arm64,android-x64
          mkdir -p build/qa
          cp build/app/outputs/flutter-apk/app-debug.apk build/qa/lingoscribe-debug.apk
          flutter build appbundle --release --target-platform android-arm64
          python ../../tools/check_android_artifact.py build/app/outputs/bundle/release/app-release.aab --report build/qa/android-aab-alignment.json
          flutter build apk --debug --target-platform android-x64 --target integration_test/native_pipeline_test.dart
          cp build/app/outputs/flutter-apk/app-debug.apk build/qa/native-pipeline-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-debug-and-unsigned-aab
          path: |
            apps/mobile/build/qa/*.apk
            apps/mobile/build/qa/*.json
            apps/mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 7

  android-runtime:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-debug-and-unsigned-aab
          path: build/android-ci-artifacts
      - name: Prepare licensed real audio and verified model fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p build/android-native-fixtures
          curl --fail --location --retry 2 --max-time 120 'https://raw.githubusercontent.com/ggml-org/whisper.cpp/927cfce34f31707e17f2bff35c349632fb9e2c3a/samples/jfk.wav' -o build/android-native-fixtures/sample.wav
          curl --fail --location --retry 2 --max-time 240 'https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base-q5_1.bin' -o build/android-native-fixtures/ggml-base-q5_1.bin
      - name: Enable KVM on the dedicated ephemeral runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native codec, microphone and real offline inference assertions
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: python3 tools/run_android_native_test.py --device emulator-5554 --apk "$(find build/android-ci-artifacts -name native-pipeline-debug.apk -print -quit)" --model build/android-native-fixtures/ggml-base-q5_1.bin --audio build/android-native-fixtures/sample.wav --report build/android-native-ci-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-native-runtime-validation
          path: build/android-native-ci-result.json
          retention-days: 7

  ios:
    needs: quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build native Whisper XCFramework from pinned source
        run: bash tools/build_ios_engine.sh
      - name: Compile iOS without private signing credentials
        working-directory: apps/mobile
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-codesign
          python3 ../../tools/check_ios_bundle.py build/ios/iphoneos/Runner.app --commit "$GITHUB_SHA" --report build/ios/bundle-check.json
          python3 ../../tools/audit_ios_licenses.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-unsigned-app
          path: |
            apps/mobile/build/ios/iphoneos/Runner.app
            apps/mobile/build/ios/bundle-check.json
            build/ios-license-audit/
          retention-days: 7
      - name: Exercise real iOS native decoding and inference on a dedicated simulator
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          mkdir -p build/ios-native-fixtures
          curl --fail --location --retry 2 --max-time 120 'https://raw.githubusercontent.com/ggml-org/whisper.cpp/927cfce34f31707e17f2bff35c349632fb9e2c3a/samples/jfk.wav' -o build/ios-native-fixtures/sample.wav
          curl --fail --location --retry 2 --max-time 240 'https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base-q5_1.bin' -o build/ios-native-fixtures/ggml-base-q5_1.bin
          cd apps/mobile
          flutter build ios --simulator --debug --target integration_test/native_pipeline_test.dart
          cd ../..
          python3 tools/run_ios_native_test.py --bundle apps/mobile/build/ios/iphonesimulator/Runner.app --model build/ios-native-fixtures/ggml-base-q5_1.bin --audio build/ios-native-fixtures/sample.wav --report build/ios-native-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-native-runtime-validation
          path: |
            build/ios-native-result.json
            build/ios-native-result.log
            build/ios-native-result.system.log
            build/ios-native-result.png
          retention-days: 7
