name: offline_engine
description: LingoScribe on-device Whisper engine and native audio normalization.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4
dev_dependencies:
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: io.github.yjxyzxyz.offline_engine
        pluginClass: OfflineEnginePlugin
      ios:
        pluginClass: OfflineEnginePlugin
