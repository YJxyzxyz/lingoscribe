name: lingoscribe
description: Privacy-first offline bilingual audio transcription.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  offline_engine:
    path: ../../packages/offline_engine
  record: ^7.1.1
  just_audio: ^0.10.6
  file_picker: ^10.3.10
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  path: ^1.9.1
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  http: ^1.5.0
  uuid: ^4.5.1
  intl: ^0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/licenses/WHISPER_LICENSE.txt
    - assets/licenses/MODEL_LICENSE.txt
    - assets/licenses/SILERO_LICENSE.txt
    - assets/models/ggml-silero-v6.2.0.bin
